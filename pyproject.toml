[project]
name = "gemini-pro-mcp"
version = "0.1.5"
description = "Use your Google AI Pro subscription from Claude, Codex, Antigravity and Gemini CLI: Gemini via the Antigravity CLI, Deep Research, Flow video, Gemini Notebooks, Jules, plus Omni video and Nano Banana images. One-command setup. MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muzaqil Hesenli" }]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "gemini",
    "google-ai-pro",
    "antigravity",
    "google-flow",
    "nano-banana",
    "video-generation",
    "claude",
    "claude-code",
    "codex",
    "gemini-cli",
    "deep-research",
    "jules",
    "notebooklm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-genai>=2.32",
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
flow = ["playwright>=1.50", "imageio-ffmpeg>=0.6"]

[project.scripts]
gemini-pro-mcp = "gemini_pro_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Muzaqil555/gemini-pro-mcp"
Issues = "https://github.com/Muzaqil555/gemini-pro-mcp/issues"
Repository = "https://github.com/Muzaqil555/gemini-pro-mcp"
Changelog = "https://github.com/Muzaqil555/gemini-pro-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["docs/demo.gif", "docs/social-preview.png"]

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_pro_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
