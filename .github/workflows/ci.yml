name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Install the Claude Code CLI
        if: matrix.python == '3.13'
        run: npm install --global @anthropic-ai/claude-code@2.1.319
      - name: Install the plugin in a fresh profile and call its offline tool
        if: matrix.python == '3.13'
        run: uv run python scripts/check_release.py --plugin
      - name: Test video stitching with bundled ffmpeg
        if: matrix.python == '3.13'
        run: uv run --extra flow pytest -q tests/test_stitch.py

  # The image MCP directories (Glama) run: it must start and answer tools/list.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t gemini-pro-mcp .
      - name: Server starts and lists its tools
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | (cat; sleep 15) | timeout 90 docker run -i --rm gemini-pro-mcp > out.jsonl || true
          cat out.jsonl
          grep -q '"gemini_ask"' out.jsonl
