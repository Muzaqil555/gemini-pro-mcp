# Publishes to PyPI when a GitHub release is published, with PyPI trusted
# publishing (no token stored here). One-time setup on pypi.org: Account ->
# Publishing -> add a pending publisher for project "gemini-pro-mcp",
# owner "Muzaqil555", repository "gemini-pro-mcp", workflow "publish.yml",
# environment "pypi". Then set the repository variable PYPI_PUBLISH=true
# (Settings -> Secrets and variables -> Actions -> Variables); until then,
# releases skip this job instead of failing.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: vars.PYPI_PUBLISH == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Lists the release in the official MCP Registry (server.json) once the
  # PyPI upload is live. The registry checks the "mcp-name:" line in README.md
  # and authenticates this repository with GitHub OIDC, so no secret is needed.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait for the PyPI release
        run: |
          version=$(jq -r .version server.json)
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/gemini-pro-mcp/$version/json" >/dev/null && exit 0
            sleep 10
          done
          echo "gemini-pro-mcp $version is not on PyPI yet" >&2; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
