# Publishes to PyPI when a GitHub release is published, with PyPI trusted
# publishing (no token stored here). One-time setup on pypi.org: Account ->
# Publishing -> add a pending publisher for project "gemini-pro-mcp",
# owner "Muzaqil555", repository "gemini-pro-mcp", workflow "publish.yml",
# environment "pypi".
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
